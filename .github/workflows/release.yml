name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to preview (for example, v0.1.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify release
    # GitHub-hosted runner (org rule: private repos on Ubicloud, public on GitHub-hosted). [bot]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"
      - run: bun install --frozen-lockfile
      - name: Repository verification
        run: bun run verify
      - name: Repository tests
        run: bun run test

  notes:
    name: extract release notes
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.value }}
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v7
      - name: Determine version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          case "$REQUESTED_VERSION" in
            v[0-9]*) ;;
            *) echo "Version must be a v-prefixed release tag: $REQUESTED_VERSION" >&2; exit 1 ;;
          esac
          printf 'value=%s\n' "$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
      - name: Extract matching changelog section
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          awk -v heading="## [${VERSION}]" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
            END {
              if (!found) {
                print "No changelog section found for " heading > "/dev/stderr"
                exit 1
              }
            }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          {
            echo 'body<<EOF'
            cat release-notes.md
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Display release notes
        run: cat release-notes.md

  publish:
    name: publish GitHub release
    if: github.event_name == 'push'
    needs: notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.notes.outputs.version }}
          NOTES: ${{ needs.notes.outputs.body }}
        run: gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --title "$VERSION" --notes "$NOTES"
